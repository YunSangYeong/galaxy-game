<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>GALAXY — 우주 슈팅</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="brand"><span class="mark">✦</span> GALAXY <small>ARCADE / 1980</small></div><div class="tools"><button id="sound" aria-pressed="false">소리 OFF</button><button id="pause">일시정지</button></div></header><section class="cabinet"><div class="hud"><div><span>점수</span><strong id="score">000000</strong></div><div class="high"><span>최고 점수</span><strong id="best">000000</strong></div><div><span>스테이지</span><strong id="stage">01</strong></div></div><div class="screen"><canvas id="game" width="600" height="700" aria-label="갤럭시 우주 슈팅 게임"></canvas><div class="overlay" id="overlay"><div class="eyebrow">READY, PILOT?</div><h1>GALAXY</h1><p id="message">편대를 뚫고, 끝까지 살아남으세요.</p><button id="start">게임 시작</button><span class="hint">ENTER 또는 SPACE로 시작</span></div><div id="wave" class="wave"></div></div><footer><span id="lives">목숨 ◆ ◆ ◆</span><span>지구 방어 작전</span></footer></section><div class="controls"><span><kbd>←</kbd><kbd>→</kbd> 이동</span><span><kbd>SPACE</kbd> 발사</span><span><kbd>P</kbd> 일시정지</span></div><div class="touch"><button id="left" aria-label="왼쪽 이동">◀</button><button id="right" aria-label="오른쪽 이동">▶</button><button id="fire">발사</button></div><p class="note">모바일에서는 화면을 드래그해 이동하고 발사 버튼을 누르세요.</p></main><script src="game.js"></script></body></html>
